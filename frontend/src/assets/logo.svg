<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="38" height="38" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="rGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Hexagon Shield -->
  <path d="M24 4 L40 12 V28 L24 44 L8 28 V12 Z" fill="url(#shieldGrad)" filter="url(#glow)" />
  <path d="M24 6.5 L38 13.5 V26.5 L24 41 L10 26.5 V13.5 Z" fill="#0f172a" opacity="0.85" />

  <!-- Geometric "R" Monogram -->
  <path d="M16 13 H25 C28.5 13 31 15 31 18.5 C31 22 28.5 24 25 24 H20 V33 H16 V13 Z M20 17 V20.5 H24.5 C26 20.5 27 19.8 27 18.75 C27 17.7 26 17 24.5 17 H20 Z" fill="url(#rGrad)" />
  <path d="M23.5 23.5 L31 33 H26 L19.5 24.5 H22.5 Z" fill="url(#rGrad)" />

  <!-- Pulse Star Dot -->
  <circle cx="33" cy="13" r="2.5" fill="#38bdf8" />
</svg>
