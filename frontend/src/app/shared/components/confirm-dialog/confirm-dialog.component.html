<div 
  class="modal d-block" 
  *ngIf="currentState" 
  tabindex="-1" 
  style="background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px);" 
  (click)="onCancel()"
>
  <div class="modal-dialog modal-dialog-centered" (click)="$event.stopPropagation()">
    <div class="modal-content border-0 shadow-lg rounded-4 p-4 text-center">
      <!-- Modal Icon Header -->
      <div class="d-flex justify-content-center mb-3">
        <div 
          class="rounded-circle p-3 d-flex align-items-center justify-content-center"
          [class.bg-danger-subtle]="currentState.options.type === 'danger'"
          [class.text-danger]="currentState.options.type === 'danger'"
          [class.bg-warning-subtle]="currentState.options.type === 'warning'"
          [class.text-warning]="currentState.options.type === 'warning'"
          [class.bg-primary-subtle]="currentState.options.type === 'info' || !currentState.options.type"
          [class.text-primary]="currentState.options.type === 'info' || !currentState.options.type"
          style="width: 60px; height: 60px;"
        >
          <mat-icon class="fs-2">{{ currentState.options.type === 'danger' ? 'delete_forever' : (currentState.options.type === 'warning' ? 'warning' : 'info') }}</mat-icon>
        </div>
      </div>

      <!-- Content -->
      <div class="mb-4">
        <h4 class="fw-bold text-dark mb-2">{{ currentState.options.title }}</h4>
        <p class="text-secondary small mb-0">{{ currentState.options.message }}</p>
      </div>

      <!-- Actions -->
      <div class="row g-2">
        <div class="col-6">
          <button type="button" class="btn btn-light w-100 py-2 fw-medium" (click)="onCancel()">
            {{ currentState.options.cancelText }}
          </button>
        </div>
        <div class="col-6">
          <button 
            type="button" 
            class="btn w-100 py-2 fw-medium shadow-sm" 
            [class.btn-danger]="currentState.options.type === 'danger'"
            [class.btn-warning]="currentState.options.type === 'warning'"
            [class.btn-primary]="currentState.options.type === 'info' || !currentState.options.type"
            (click)="onConfirm()"
          >
            {{ currentState.options.confirmText }}
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
