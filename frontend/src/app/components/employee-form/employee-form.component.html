<div class="modal d-block" tabindex="-1" style="background: rgba(15, 23, 42, 0.5); backdrop-filter: blur(4px);" (click)="close.emit()">
  <div class="modal-dialog modal-dialog-centered" (click)="$event.stopPropagation()">
    <div class="modal-content border-0 shadow-lg rounded-4 overflow-hidden">
      <!-- Modal Header -->
      <div class="modal-header bg-light border-0 py-3 px-4">
        <h5 class="modal-title fw-bold text-dark mb-0">
          {{ employee?.id ? 'Edit Employee' : 'Add New Employee' }}
        </h5>
        <button type="button" class="btn-close" (click)="close.emit()"></button>
      </div>

      <!-- Modal Body -->
      <div class="modal-body p-4">
        <!-- Profile Picture Upload -->
        <div class="mb-4">
          <label class="form-label fw-semibold text-secondary small mb-2">Profile Photo</label>
          <div class="d-flex align-items-center gap-3">
            <div class="form-avatar-preview flex-shrink-0">
              <img *ngIf="imagePreview" [src]="imagePreview" alt="Profile Preview" class="rounded-circle object-fit-cover w-100 h-100" />
              <div *ngIf="!imagePreview" class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center fw-bold fs-4 w-100 h-100">
                {{ formData.name ? formData.name.charAt(0).toUpperCase() : '📷' }}
              </div>
            </div>
            <div>
              <input 
                type="file" 
                #fileInput 
                (change)="onFileSelected($event)" 
                accept="image/*" 
                class="d-none" />
              <button type="button" class="btn btn-sm btn-outline-secondary d-flex align-items-center gap-1" (click)="fileInput.click()">
                <mat-icon>photo_camera</mat-icon> Choose Image
              </button>
              <div class="text-muted small mt-1" *ngIf="selectedFile">{{ selectedFile.name }}</div>
            </div>
          </div>
        </div>

        <!-- Form Fields -->
        <div class="mb-3">
          <label class="form-label fw-semibold text-secondary small">Full Name *</label>
          <input 
            type="text" 
            [(ngModel)]="formData.name" 
            class="form-control" 
            placeholder="Enter full name"
            required />
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold text-secondary small">Email Address *</label>
          <input 
            type="email" 
            [(ngModel)]="formData.email" 
            class="form-control" 
            placeholder="Enter email"
            required />
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold text-secondary small">Department *</label>
          <select [(ngModel)]="formData.department" class="form-select" required>
            <option value="">Select Department</option>
            <option value="IT">IT</option>
            <option value="HR">HR</option>
            <option value="Finance">Finance</option>
            <option value="Marketing">Marketing</option>
            <option value="Sales">Sales</option>
            <option value="Operations">Operations</option>
          </select>
        </div>

        <div class="row g-2 mb-3">
          <div class="col-md-6">
            <label class="form-label fw-semibold text-secondary small">Salary ($) *</label>
            <input 
              type="number" 
              [(ngModel)]="formData.sal" 
              class="form-control" 
              placeholder="Enter salary"
              min="0"
              step="1000"
              required />
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold text-secondary small">Official Joining Date *</label>
            <input 
              type="date" 
              [(ngModel)]="formData.joiningDate" 
              class="form-control" 
              required />
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold text-secondary small">Lifecycle Status *</label>
          <select [(ngModel)]="formData.status" class="form-select" required>
            <option value="ACTIVE">ACTIVE (Current Staff)</option>
            <option value="ONBOARDING">ONBOARDING (New Recruit Pipeline)</option>
            <option value="OFFBOARDING">OFFBOARDING (Exiting Process)</option>
            <option value="TERMINATED">TERMINATED (Exited Staff)</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold text-secondary small">Tech Stack Summary / Primary Skills</label>
          <input 
            type="text" 
            [(ngModel)]="formData.techStackSummary" 
            class="form-control" 
            placeholder="e.g. Java, Spring Boot, Angular, PostgreSQL" />
        </div>

        <!-- Role Assignment Checks -->
        <div class="mb-3">
          <label class="form-label fw-semibold text-secondary small">Assigned System Roles *</label>
          <div class="d-flex flex-wrap gap-2 pt-1">
            <div *ngFor="let role of availableRoles" class="form-check me-2">
              <input 
                type="checkbox" 
                class="form-check-input cursor-pointer" 
                [id]="'role_' + role.value"
                [checked]="isRoleSelected(role.value)"
                (change)="toggleRole(role.value)" />
              <label class="form-check-label small cursor-pointer" [for]="'role_' + role.value">
                {{ role.label }}
              </label>
            </div>
          </div>
        </div>


        <!-- Validation Error Alert Banner -->
        <div *ngIf="validationErrorMessage" class="alert alert-danger d-flex align-items-center gap-2 mt-3 mb-0" role="alert">

          <mat-icon style="font-size: 20px; width: 20px; height: 20px;">error</mat-icon>
          <div class="small fw-semibold">{{ validationErrorMessage }}</div>
        </div>
      </div>


      <!-- Modal Footer -->
      <div class="modal-footer bg-light border-0 py-3 px-4">
        <button type="button" class="btn btn-light px-4 fw-medium" (click)="close.emit()">Cancel</button>
        <button type="button" class="btn btn-primary px-4 fw-medium shadow-sm" [disabled]="isUploading" (click)="save()">
          <span *ngIf="isUploading" class="spinner-border spinner-border-sm me-1" role="status"></span>
          Save Employee
        </button>
      </div>
    </div>
  </div>
</div>
